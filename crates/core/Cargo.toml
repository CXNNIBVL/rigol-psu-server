[package]
name = "psu-core"
description = "Domain model, configuration, clamps and supply supervision."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Exposes the simulated-supply backend so the server can run without hardware.
# Kept off by default so the release binary cannot fabricate instrument state.
simulation = []
# Propagates schema derives down to the driver crate's value types.
openapi = ["dep:utoipa", "dp832/openapi"]

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[dependencies]
dp832 = { workspace = true, features = ["serde"] }
rusqlite.workspace = true
utoipa = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
